<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Me | Tarek Almodóvar </title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>

  <!-- NAVBAR -->
  <header class="header-navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-brand">Almodóvar Tarek</a>
      <nav>
        <ul class="nav-menu">
          <li><a href="index.html" class="nav-link">Homepage</a></li>
          <li><a href="about.html" class="nav-link">About Me</a></li>
          <li><a href="cv.html" class="nav-link">CV</a></li>
          <li><a href="contact.html" class="nav-link active">Contact Me</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="main-container animate-fade-in">
    <section class="page-header">
      <h1>Contact Me</h1>
      <p>Do you have any questions or a project in mind? Send me a message.</p>
    </section>

    <section class="contact-wrapper">
      <form class="contact-form card">
        <div class="form-group">
          <label for="name">Nombre</label>
          <input type="text" id="name" name="name" required placeholder="Tu nombre">
        </div>
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" name="email" required placeholder="tuemail@ejemplo.com">
        </div>
        <div class="form-group">
          <label for="message">Mensaje</label>
          <textarea id="message" name="message" rows="5" required placeholder="Escribe tu mensaje aquí..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Enviar Mensaje</button>
      </form>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <p>&copy; 2026 Almodóvar Tarek. All rights reserved.</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
